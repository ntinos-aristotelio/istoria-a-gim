<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ιστορία Α Γυμνασίου</title>
<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:linear-gradient(135deg,#f8efdf,#ead1aa);
color:#2b2118;
}
.wrap{
max-width:1100px;
margin:auto;
padding:40px 20px;
}
.hero{
background:#fff8ec;
padding:40px;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
margin-bottom:30px;
}
h1{
font-size:60px;
color:#7b421f;
margin:0 0 10px;
}
p{
font-size:24px;
line-height:1.5;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}
.card{
background:#fff8ec;
padding:25px;
border-radius:25px;
box-shadow:0 8px 22px rgba(0,0,0,.1);
}
a{
display:inline-block;
margin-top:20px;
background:#7b421f;
color:white;
padding:14px 20px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}
.tag{
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:#e5f0ec;
margin-top:10px;
}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>Ψηφιακή Ιστορία Α΄ Γυμνασίου</h1>
<p>Διαδραστικά κεφάλαια, δραστηριότητες και κουίζ για το μάθημα της Ιστορίας.</p>
</div>

<div class="cards">
<div class="card">
<h2>🏺 Κεφάλαιο 1</h2>
<p>Η Εποχή του Λίθου</p>
<div class="tag">διαθέσιμο</div><br>
<a href="chapter1.html">Άνοιγμα</a>
</div>

<div class="card">
<h2>🛶 Κεφάλαιο 2</h2>
<p>Η Εποχή του Χαλκού</p>
<div class="tag">διαθέσιμο</div><br>
<a href="chapter2.html">Άνοιγμα</a>
</div>
</div>
</div>
</body>
</html>
